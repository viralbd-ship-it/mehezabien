<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Framebox | Watch Preview</title>
<meta name="description" content="Video preview page with sponsor links.">
<meta name="theme-color" content="#101114">
<style>
  :root{
    --bg:#101114; --card:#1b1d22; --card2:#23262d; --line:#2c2f37;
    --text:#fff; --muted:#aab0bb; --accent:#ff3038; --accent2:#ff5a61; --accent3:#d41f27;
    --radius:20px; --max:900px;
    --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.55;overflow-x:hidden;position:relative}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(900px 500px at 15% -10%,rgba(255,48,56,.14),transparent 60%),
               radial-gradient(700px 500px at 100% 10%,rgba(80,110,255,.08),transparent 60%)}
  .wrap{position:relative;z-index:1;width:100%;max-width:var(--max);margin:0 auto;padding:0 16px}
  a{color:inherit}
  :focus-visible{outline:3px solid #ffd166;outline-offset:3px;border-radius:8px}

  header.site{position:sticky;top:0;z-index:30;background:rgba(16,17,20,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  header.site .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
  .logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:1.25rem;letter-spacing:.04em}
  .logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#a8141b);display:grid;place-items:center;box-shadow:0 4px 14px rgba(255,48,56,.45)}
  .logo i svg{width:14px;height:14px;fill:#fff;margin-left:2px}
  .logo b{color:var(--accent)}
  nav a{color:var(--muted);text-decoration:none;font-weight:600;padding:8px 14px;border-radius:999px}
  nav a:hover{color:#fff;background:var(--card2)}

  main{position:relative;z-index:1;padding:14px 0 48px}

  /* ads */
  .ad{margin:18px auto;text-align:center;max-width:100%;overflow:hidden}
  .ad-label{display:block;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:#7d838f;margin-bottom:6px}
  .ad-slot{display:flex;flex-direction:column;align-items:center;justify-content:center;max-width:100%;overflow:hidden;min-height:50px}
  .ad-slot iframe,.ad-slot img{max-width:100%}
  .ad-banner-box{width:100%;max-width:468px;margin:0 auto;overflow:hidden;position:relative;height:60px}
  .ad-banner-inner{width:468px;height:60px;transform-origin:top left}

  /* media cards */
  .media{position:relative;margin:8px 0 0}
  .glow{position:absolute;inset:6% 4% -6% 4%;background-size:cover;background-position:center;filter:blur(46px) saturate(1.3);opacity:.45;border-radius:40px;z-index:0}
  .frame{position:relative;z-index:1;border-radius:var(--radius);padding:2px;background:linear-gradient(135deg,rgba(255,48,56,.9),rgba(255,255,255,.08) 40%,rgba(255,255,255,.08) 60%,rgba(255,48,56,.55));box-shadow:0 26px 60px rgba(0,0,0,.55)}
  .frame.alt{background:linear-gradient(135deg,rgba(120,150,255,.7),rgba(255,255,255,.08) 40%,rgba(255,255,255,.08) 60%,rgba(120,150,255,.4))}
  .frame .in{background:var(--card);border-radius:calc(var(--radius) - 2px);padding:10px}
  .player{position:relative;display:block;width:100%;padding:0;border:0;background:#000;border-radius:14px;overflow:hidden;cursor:pointer;aspect-ratio:16/9}
  .player img{display:block;width:100%;height:100%;object-fit:contain;transition:transform .6s ease}
  .player::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 45%);pointer-events:none}
  .ph{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--muted);background:linear-gradient(135deg,#202329,#101114);font-size:.95rem}
  .player.no-img .ph{display:flex}
  .player.no-img img{display:none}
  .play{position:absolute;z-index:2;left:50%;top:50%;width:88px;height:88px;margin:-44px 0 0 -44px;border-radius:50%;background:rgba(255,48,56,.95);display:grid;place-items:center;box-shadow:0 0 0 10px rgba(255,48,56,.22),0 14px 34px rgba(0,0,0,.55);transition:transform .25s ease, box-shadow .25s ease}
  .play svg{width:38px;height:38px;fill:#fff;margin-left:6px}
  .tag{position:absolute;z-index:2;left:12px;bottom:10px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);padding:4px 10px;border-radius:999px}
  @media (hover:hover){
    .player:hover img{transform:scale(1.03)}
    .player:hover .play{transform:scale(1.1);box-shadow:0 0 0 16px rgba(255,48,56,.2),0 14px 34px rgba(0,0,0,.55)}
  }
  @media (max-width:600px){
    .play{width:66px;height:66px;margin:-33px 0 0 -33px}
    .play svg{width:28px;height:28px}
  }

  .meta{padding:20px 6px 4px;text-align:center}
  .meta h1{margin:0 0 8px;font-size:clamp(1.3rem,4vw,2rem);line-height:1.2;letter-spacing:-.01em}
  .meta p{margin:0 auto;color:var(--muted);max-width:640px}

  .cta{margin-top:18px}
  .btn{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;min-height:70px;padding:10px 24px;border:0;border-radius:16px;font:inherit;color:#fff;cursor:pointer;
    background:linear-gradient(180deg,var(--accent2),var(--accent) 45%,var(--accent3));box-shadow:0 12px 28px rgba(255,48,56,.35), inset 0 1px 0 rgba(255,255,255,.3);transition:transform .12s, box-shadow .2s, filter .2s}
  .btn:hover{filter:brightness(1.08);box-shadow:0 16px 34px rgba(255,48,56,.5), inset 0 1px 0 rgba(255,255,255,.35)}
  .btn:active{transform:translateY(2px) scale(.995);filter:brightness(.95)}
  .btn svg{width:30px;height:30px;fill:currentColor;flex:none}
  .btn .t{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;text-align:left}
  .btn .t strong{font-size:1.35rem;letter-spacing:.02em}
  .btn .t small{font-size:.8rem;opacity:.92;font-weight:500}
  .note{margin:10px 2px 0;font-size:.82rem;color:#8b919c;text-align:center}
  .status{min-height:1.4em;margin-top:6px;text-align:center;font-size:.9rem;color:#ff9a9e}

  footer{position:relative;z-index:1;border-top:1px solid var(--line);background:#0c0d10;padding:24px 0;color:var(--muted);font-size:.9rem}
  footer .wrap{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between}
  footer a{text-decoration:none;font-weight:600;color:var(--muted)}
  footer a:hover{color:#fff;text-decoration:underline}

  dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--text);padding:0;max-width:min(440px,calc(100vw - 32px));width:100%}
  dialog::backdrop{background:rgba(0,0,0,.75);backdrop-filter:blur(3px)}
  .dlg{padding:24px}
  .dlg h3{margin:0 0 8px;font-size:1.25rem}
  .dlg p{margin:0 0 20px;color:var(--muted)}
  .dlg .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
  .dlg button{min-height:46px;padding:0 22px;border-radius:12px;border:0;font:inherit;font-weight:700;color:#fff;cursor:pointer;background:var(--accent)}
  .dlg button:hover{background:var(--accent2)}
  .dlg button.ghost{background:var(--card2);border:1px solid var(--line)}
  .dlg button.ghost:hover{background:#2e323b}

  #dbg{display:none;position:fixed;left:10px;bottom:10px;z-index:99;max-width:min(340px,calc(100vw - 20px));background:rgba(0,0,0,.9);border:1px solid #444;border-radius:10px;padding:10px 12px;font:12px/1.5 ui-monospace,Consolas,monospace;color:#d6d6d6}
  #dbg b{color:#fff} #dbg .r{margin-top:4px}

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="logo" href="#top" aria-label="Home"><i aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></i><span id="siteName">FRAME<b>BOX</b></span></a>
    <nav aria-label="Primary"><a href="#top">Home</a></nav>
  </div>
</header>

<main id="top">
  <div class="wrap">

    <!-- ===================== ADVERTISEMENT 1: external JavaScript ad (below header, above Thumbnail 1) ===================== -->
    <aside class="ad" aria-label="Advertisement">
      <span class="ad-label">Advertisement</span>
      <div class="ad-slot" id="slot1">
        <script src="https://sturgeonvelocity.com/1a/80/6e/1a806ec139a767620109b6758399c1c9.js"></script>
      </div>
    </aside>

    <!-- ===================== THUMBNAIL 1 (main) ===================== -->
    <section class="media" aria-label="Main video preview">
      <div class="glow" id="glow1" aria-hidden="true"></div>
      <div class="frame"><div class="in">
        <button class="player" id="player1" type="button" aria-label="Play main video (opens a sponsor page after confirmation)">
          <img id="img1" alt="Main video thumbnail" decoding="async" fetchpriority="high" referrerpolicy="no-referrer">
          <div class="ph">Thumbnail 1 could not be loaded.<br>Set a direct image link in THUMBNAIL_1_URL (CONFIG).</div>
          <span class="play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
          <span class="tag">Sponsored link</span>
        </button>
      </div></div>
    </section>

    <div class="meta">
      <h1 id="title"></h1>
      <p id="desc"></p>
    </div>

    <!-- ===================== THUMBNAIL 2 ===================== -->
    <section class="media" style="margin-top:22px" aria-label="Second preview">
      <div class="frame alt"><div class="in">
        <button class="player" id="player2" type="button" aria-label="Play second preview (opens a sponsor page after confirmation)">
          <img id="img2" alt="Second video thumbnail" decoding="async" loading="lazy" referrerpolicy="no-referrer">
          <div class="ph">Thumbnail 2 could not be loaded.<br>Set a direct image link in THUMBNAIL_2_URL (CONFIG).</div>
          <span class="play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
          <span class="tag">Sponsored link</span>
        </button>
      </div></div>
    </section>

    <!-- ===================== DOWNLOAD NOW ===================== -->
    <div class="cta">
      <button class="btn" id="dlBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.17l3.59-3.58L17 11l-5 5-5-5 1.41-1.41L11 13.17V3h1zM5 19h14v2H5z"/></svg>
        <span class="t"><strong>Download Now</strong><small>Opens a sponsor page in a new tab</small></span>
      </button>
      <p class="note">This button opens an advertising destination. It does not save a file from this page.</p>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </div>

    <!-- ===================== ADVERTISEMENT 2: 468 x 60 banner (below Download Now) ===================== -->
    <aside class="ad" aria-label="Advertisement">
      <span class="ad-label">Advertisement</span>
      <div class="ad-banner-box" id="bannerBox">
        <div class="ad-banner-inner" id="bannerInner">
          <script>
            atOptions = {
              'key': '895468b7eaed07986b15d35cc92103e8',
              'format': 'iframe',
              'height': 60,
              'width': 468,
              'params': {}
            };
          </script>
          <script src="https://sturgeonvelocity.com/895468b7eaed07986b15d35cc92103e8/invoke.js"></script>
        </div>
      </div>
    </aside>

    <!-- ===================== ADVERTISEMENT 3: additional container (before footer) ===================== -->
    <aside class="ad" aria-label="Advertisement">
      <span class="ad-label">Advertisement</span>
      <div class="ad-slot" id="slot3">
        <script async="async" data-cfasync="false" src="https://sturgeonvelocity.com/b37964aa213e4295112b2691564a5c98/invoke.js"></script>
        <div id="container-b37964aa213e4295112b2691564a5c98"></div>
      </div>
    </aside>

  </div>
</main>

<footer>
  <div class="wrap">
    <span>&copy; <span id="year"></span> <span id="siteName2"></span></span>
    <span><a href="#" id="privacyLink">Privacy Policy</a> &nbsp;&middot;&nbsp; <a href="#" id="contactLink">Contact</a></span>
  </div>
</footer>

<dialog id="confirm" aria-labelledby="cTitle" aria-describedby="cText">
  <div class="dlg">
    <h3 id="cTitle">Continue to the video?</h3>
    <p id="cText">This action may open an advertisement in a new tab.</p>
    <div class="row">
      <button class="ghost" id="cCancel" type="button">Cancel</button>
      <button id="cContinue" type="button">Continue</button>
    </div>
  </div>
</dialog>

<div id="dbg"></div>

<script>
/* =====================================================================
   CONFIG - edit only this block
   ===================================================================== */
const SITE_NAME = "FRAMEBOX";

// Thumbnail 1 (MAIN). Exact link supplied. It is an Imgur PAGE url; the code converts it to the
// direct i.imgur.com/<id>.jpg|png|webp|jpeg form and tries each. If all fail, paste a direct image link.
const THUMBNAIL_1_URL = "https://imgur.com/tCryRZO";

// Thumbnail 2 (shown below the title). Exact link supplied; resolved the same way.
const THUMBNAIL_2_URL = "https://imgur.com/K3Z7xRH";

// Real playable video file (e.g. an .mp4 link). None was supplied, so it is empty and no video is
// presented as playable. Both thumbnails and the Download Now button open AD_CLICK_URL instead.
const VIDEO_SOURCE_URL = "";

// Advertising destination. Opened in a new tab only after the visitor clicks Continue.
const AD_CLICK_URL = "https://sturgeonvelocity.com/cpsk36n9?key=f494b534a5d0c257002731ff150918ce";

const VIDEO_TITLE = "Your Video Title Here";
const VIDEO_DESCRIPTION = "Short description of the video. Edit VIDEO_DESCRIPTION in the CONFIG section.";

// Footer links (leave empty to show a "not configured" notice)
const PRIVACY_URL = "";
const CONTACT_URL = ""; // e.g. "mailto:you@example.com"
/* ===================== END CONFIG ===================== */

(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  $("title").textContent = VIDEO_TITLE;
  $("desc").textContent = VIDEO_DESCRIPTION;
  $("year").textContent = new Date().getFullYear();
  $("siteName2").textContent = SITE_NAME;
  var sn = $("siteName"); sn.textContent = "";
  var half = Math.ceil(SITE_NAME.length / 2);
  sn.appendChild(document.createTextNode(SITE_NAME.slice(0, half)));
  var bold = document.createElement("b"); bold.textContent = SITE_NAME.slice(half); sn.appendChild(bold);
  document.title = SITE_NAME + " | Watch Preview";

  function setStatus(msg) { $("status").textContent = msg || ""; }

  /* ---- Imgur page URL -> direct image candidates ---- */
  function candidates(url) {
    var m = /^https?:\/\/(?:www\.)?imgur\.com\/(?:gallery\/|a\/)?([A-Za-z0-9]+)\/?$/.exec(url);
    return m ? ["jpg", "png", "webp", "jpeg"].map(function (e) { return "https://i.imgur.com/" + m[1] + "." + e; }) : [url];
  }
  function loadThumb(imgId, playerId, glowId, url) {
    var img = $(imgId), box = $(playerId), list = candidates(url), i = 0;
    img.addEventListener("load", function () {
      // keep the image's own proportions, no cropping or stretching
      if (img.naturalWidth && img.naturalHeight) box.style.aspectRatio = img.naturalWidth + " / " + img.naturalHeight;
      if (glowId) $(glowId).style.backgroundImage = "url('" + (img.currentSrc || img.src) + "')";
    });
    img.addEventListener("error", function () {
      i++;
      if (i < list.length) img.src = list[i];
      else { box.classList.add("no-img"); if (glowId) $(glowId).style.display = "none"; }
    });
    img.src = list[0];
  }
  loadThumb("img1", "player1", "glow1", THUMBNAIL_1_URL);
  loadThumb("img2", "player2", null, THUMBNAIL_2_URL);

  /* ---- Notice dialog, then open the destination safely in a new tab ---- */
  var dlg = $("confirm"), pending = null, lastFocus = null;
  function ask(title, text) {
    pending = AD_CLICK_URL; lastFocus = document.activeElement;
    $("cTitle").textContent = title; $("cText").textContent = text;
    if (typeof dlg.showModal === "function") dlg.showModal();
    else if (window.confirm(title + " " + text)) go();
  }
  function go() { if (!pending) return; window.open(pending, "_blank", "noopener,noreferrer"); pending = null; }
  $("cContinue").addEventListener("click", function () { dlg.close(); go(); });
  $("cCancel").addEventListener("click", function () { pending = null; dlg.close(); });
  dlg.addEventListener("close", function () { if (lastFocus && lastFocus.focus) lastFocus.focus(); });
  dlg.addEventListener("click", function (e) { if (e.target === dlg) { pending = null; dlg.close(); } });

  var playMsg = ["Continue to the video?", "This action may open an advertisement in a new tab."];
  $("player1").addEventListener("click", function () { ask(playMsg[0], playMsg[1]); });
  $("player2").addEventListener("click", function () { ask(playMsg[0], playMsg[1]); });
  $("dlBtn").addEventListener("click", function () {
    ask("Continue to the sponsor page?", "This opens a sponsor page in a new tab. No file is downloaded by this page.");
  });

  /* ---- Footer links ---- */
  function wire(id, url, label) {
    var a = $(id);
    if (url) { a.href = url; return; }
    a.addEventListener("click", function (e) { e.preventDefault(); setStatus(label + " link is not configured yet (see CONFIG)."); window.scrollTo({ top: 0 }); });
  }
  wire("privacyLink", PRIVACY_URL, "Privacy Policy");
  wire("contactLink", CONTACT_URL, "Contact");

  /* ---- Scale the fixed 468x60 banner on narrow screens ---- */
  function fit() {
    var box = $("bannerBox"), inner = $("bannerInner"), s = Math.min(1, box.clientWidth / 468);
    inner.style.transform = "scale(" + s + ")"; box.style.height = Math.ceil(60 * s) + "px";
  }
  fit(); window.addEventListener("resize", fit); window.addEventListener("load", fit);

  /* ---- Ad diagnostics: only with ?debug=1 (read-only; never executes URL input) ---- */
  if (new URLSearchParams(location.search).get("debug") === "1") {
    var panel = $("dbg"); panel.style.display = "block";
    var ads = [
      { n: "Ad 1 (external JS)", m: "1a806ec139a767620109b6758399c1c9.js", el: function () { return $("slot1"); } },
      { n: "Ad 2 (468x60)", m: "895468b7eaed07986b15d35cc92103e8/invoke.js", el: function () { return $("bannerInner"); } },
      { n: "Ad 3 (container)", m: "b37964aa213e4295112b2691564a5c98/invoke.js", el: function () { return document.getElementById("container-b37964aa213e4295112b2691564a5c98"); } }
    ];
    var check = function () {
      var res = performance.getEntriesByType("resource");
      var out = "<b>Ad status (diagnostic)</b>";
      ads.forEach(function (a) {
        var requested = !!document.querySelector('script[src*="' + a.m + '"]');
        var entry = res.filter(function (r) { return r.name.indexOf(a.m) > -1; })[0];
        var loaded = entry && entry.responseEnd > 0;
        var el = a.el(), content = false;
        if (el) content = (el.id.indexOf("container-") === 0) ? el.children.length > 0 : el.querySelectorAll("iframe,img,ins").length > 0;
        out += '<div class="r">' + a.n + ": " + (requested ? "requested" : "missing") + " / " +
          (loaded ? "script loaded" : "not loaded (blocked or pending)") + " / " +
          (content ? "content detected" : "no visible content detected") + "</div>";
      });
      out += '<div class="r">Detection is not proof of an impression; some ad types show nothing in the page.</div>';
      panel.innerHTML = out;
    };
    check(); var n = 0, t = setInterval(function () { check(); if (++n > 15) clearInterval(t); }, 1000);
  }
})();
</script>
</body>
</html>
